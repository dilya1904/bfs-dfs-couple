name: Deploy BFS-DFS-Couple to Cloud Run

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  PROJECT_ID: newproject-513100
  REGION: asia-northeast3
  SERVICE_NAME: bfs-dfs-couple
  GAR_REPOSITORY: cloud-run-source-deploy
  IMAGE_NAME: asia-northeast3-docker.pkg.dev/newproject-513100/cloud-run-source-deploy/bfs-dfs-couple

jobs:
  deploy:
    name: Build & Deploy bfs-dfs-couple to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet

      - name: Build and Push Container Image
        run: |
          IMAGE_TAG="${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LATEST_TAG="${{ env.IMAGE_NAME }}:latest"
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --allow-unauthenticated
            --port=8080
          env_vars: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Smoke Test /health Endpoint
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Deployed Cloud Run URL: $URL"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Smoke test failed! Expected HTTP 200, got $HTTP_STATUS"
            exit 1
          fi
          echo "Smoke test passed!"
